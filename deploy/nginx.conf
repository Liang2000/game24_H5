# game24 H5 站点配置
# 服务器部署路径：/etc/nginx/sites-available/game24
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/game24;
    index index.html;

    # 单页应用回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
